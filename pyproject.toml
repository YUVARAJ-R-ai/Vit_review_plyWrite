[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vit-feedback"
version = "0.1.0"
description = "Playwright automation and MCP server for VIT End-Semester Feedback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40.0",
    "fastmcp>=0.1.0",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
    "ddddocr>=1.5.0",
    "numpy>=1.24.0",
]

[project.scripts]
vit-feedback = "vit_feedback.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vit_feedback"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
